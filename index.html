<!DOCTYPE html>
<html lang='tr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover'>

<style>
body{font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.glass{background:rgba(30,41,59,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,.14)}
.noscroll::-webkit-scrollbar{display:none}.noscroll{scrollbar-width:none}
.kbtn{min-height:52px;border-radius:1rem;font-weight:600;font-size:1.05rem;transition:transform .08s,filter .2s;user-select:none;cursor:pointer}
.kbtn:active{transform:scale(.92);filter:brightness(1.25)}
.kdig{background:#1e293b;color:#e2e8f0}
.kop{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff}
.kfn{background:rgba(34,211,238,.12);color:#67e8f9;border:1px solid rgba(34,211,238,.25)}
.kac{background:rgba(244,63,94,.15);color:#fda4af;border:1px solid rgba(244,63,94,.3)}
.keq{background:linear-gradient(135deg,#06b6d4,#8b5cf6);color:#fff;box-shadow:0 6px 20px rgba(34,211,238,.35)}
.tab-btn{transition:all .25s}
.tab-btn.on{background:linear-gradient(135deg,#0891b2,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.4)}
input,button{outline:none}
.fade{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
input[type=range]{accent-color:#06b6d4}
</style>
</head>
<body class='bg-[#0f172a] text-slate-100 min-h-screen'>
<div class='max-w-3xl mx-auto px-4 pb-16'>
<header class='pt-7 pb-3 text-center'>

<p class='text-xs text-slate-400 mt-1'>Hesap · Bilimsel · Grafik · Kimya · Trigonometri</p>
</header>
<nav class='sticky top-0 z-20 py-2 bg-[#0f172a]/85 backdrop-blur'>

<button data-tab='basic' class='tab-btn flex-none px-4 py-2.5 min-h-[44px] rounded-xl text-sm font-semibold text-slate-300 whitespace-nowrap active:scale-95'>🔢 Normal</button>
<button data-tab='scientific' class='tab-btn flex-none px-4 py-2.5 min-h-[44px] rounded-xl text-sm font-semibold text-slate-300 whitespace-nowrap active:scale-95'>🔬 Bilimsel</button>
<button data-tab='graph' class='tab-btn flex-none px-4 py-2.5 min-h-[44px] rounded-xl text-sm font-semibold text-slate-300 whitespace-nowrap active:scale-95'>📈 Grafik</button>

<button data-tab='circle' class='tab-btn flex-none px-4 py-2.5 min-h-[44px] rounded-xl text-sm font-semibold text-slate-300 whitespace-nowrap active:scale-95'>⭕ Trigonometri</button>
</div>

<section id='tab-basic' class='tabsec mt-4 fade'>
<div class='glass rounded-2xl p-4'>
<div class='flex justify-between text-xs text-slate-400 mb-2'><span>Geçmiş</span><button id='bHC' class='text-cyan-400 active:scale-95 transition'>Temizle</button></div>
<div id='bHist' class='text-right text-sm text-slate-400 space-y-0.5 max-h-24 overflow-y-auto noscroll mb-3'></div>
<div id='bExpr' class='text-right text-lg text-slate-400 break-all min-h-[26px]'></div>
<div id='bDisp' class='text-right text-4xl font-bold break-all min-h-[52px]'>0</div>
</div>
<div class='grid grid-cols-4 gap-2.5 mt-4'>
<button class='kbtn kac' data-k='AC'>AC</button><button class='kbtn kac' data-k='B'>⌫</button><button class='kbtn kop' data-k='ins:%'>%</button><button class='kbtn kop' data-k='ins:/'>÷</button>
<button class='kbtn kdig' data-k='ins:7'>7</button><button class='kbtn kdig' data-k='ins:8'>8</button><button class='kbtn kdig' data-k='ins:9'>9</button><button class='kbtn kop' data-k='ins:*'>×</button>
<button class='kbtn kdig' data-k='ins:4'>4</button><button class='kbtn kdig' data-k='ins:5'>5</button><button class='kbtn kdig' data-k='ins:6'>6</button><button class='kbtn kop' data-k='ins:-'>−</button>
<button class='kbtn kdig' data-k='ins:1'>1</button><button class='kbtn kdig' data-k='ins:2'>2</button><button class='kbtn kdig' data-k='ins:3'>3</button><button class='kbtn kop' data-k='ins:+'>+</button>
<button class='kbtn kdig' data-k='pm'>±</button><button class='kbtn kdig' data-k='ins:0'>0</button><button class='kbtn kdig' data-k='ins:.'>.</button><button class='kbtn keq' data-k='eq'>=</button>
</div>
</section>

<section id='tab-scientific' class='tabsec mt-4 hidden fade'>
<div class='glass rounded-2xl p-4'>
<div class='flex justify-between text-xs text-slate-400 mb-2'><span>Hafıza: <b id='memV' class='text-cyan-400'>0</b></span><span>Canlı Sonuç</span></div>
<div id='sLive' class='text-right text-lg text-cyan-300 break-all min-h-[28px]'>0</div>
<input id='sIn' type='text' placeholder='İfade yazın veya tuşları kullanın' class='mt-2 w-full text-right text-2xl font-bold bg-[#0f172a] border border-slate-700 rounded-xl px-3 py-3 focus:border-cyan-500 transition break-all'>
</div>
<div class='grid grid-cols-5 gap-2 mt-4'>
<button class='kbtn kfn' data-s='MC'>MC</button><button class='kbtn kfn' data-s='MR'>MR</button><button class='kbtn kfn' data-s='M+'>M+</button><button class='kbtn kfn' data-s='M-'>M−</button><button class='kbtn kac' data-s='C'>AC</button>
<button class='kbtn kfn' data-s='ins:sin('>sin</button><button class='kbtn kfn' data-s='ins:cos('>cos</button><button class='kbtn kfn' data-s='ins:tan('>tan</button><button class='kbtn kfn' data-s='ins:log('>log</button><button class='kbtn kfn' data-s='ins:ln('>ln</button>
<button class='kbtn kfn' data-s='ins:^'>xʸ</button><button class='kbtn kfn' data-s='ins:sqrt('>√</button><button class='kbtn kfn' data-s='ins:!'>n!</button><button class='kbtn kfn' data-s='ins:pi'>π</button><button class='kbtn kfn' data-s='ins:e'>e</button>
<button class='kbtn kop' data-s='ins:('>(</button><button class='kbtn kop' data-s='ins:)'>)</button><button class='kbtn kop' data-s='ins:/'>÷</button><button class='kbtn kop' data-s='ins:*'>×</button><button class='kbtn kop' data-s='ins:-'>−</button>
<button class='kbtn kdig' data-s='ins:7'>7</button><button class='kbtn kdig' data-s='ins:8'>8</button><button class='kbtn kdig' data-s='ins:9'>9</button><button class='kbtn kop' data-s='ins:+'>+</button><button class='kbtn kac' data-s='B'>⌫</button>
<button class='kbtn kdig' data-s='ins:4'>4</button><button class='kbtn kdig' data-s='ins:5'>5</button><button class='kbtn kdig' data-s='ins:6'>6</button><button class='kbtn kdig' data-s='ins:.'>.</button><button class='kbtn keq' data-s='eq'>=</button>
<button class='kbtn kdig col-span-5' data-s='ins:0'>0</button>
</div>

<label class='text-xs text-slate-400'>f(x) fonksiyonu</label>
<input id='gFn' type='text' value='sin(x)' placeholder='örn: x^2, sin(x), 2*x+3' class='mt-1 w-full bg-[#0f172a] border border-slate-700 rounded-xl px-3 py-3 text-lg text-cyan-300 focus:border-cyan-500 transition'>
<div class='grid grid-cols-3 gap-2 mt-3'>
<div><label class='text-xs text-slate-400'>x min</label><input id='gMin' type='number' value='-10' class='mt-1 w-full bg-[#0f172a] border border-slate-700 rounded-lg px-2 py-2.5 text-sm'></div>
<div><label class='text-xs text-slate-400'>x max</label><input id='gMax' type='number' value='10' class='mt-1 w-full bg-[#0f172a] border border-slate-700 rounded-lg px-2 py-2.5 text-sm'></div>
<div class='flex items-end'><button id='gReset' class='w-full min-h-[46px] rounded-lg bg-rose-500/15 text-rose-300 border border-rose-500/30 font-semibold text-sm active:scale-95 transition'>Sıfırla</button></div>
</div>
<div class='mt-4 rounded-xl overflow-hidden bg-[#0f172a] border border-slate-800'><canvas id='gCanvas' height='320'></canvas></div>
<p id='gErr' class='text-sm text-rose-400 mt-2 hidden'></p>
<p class='text-xs text-slate-500 mt-2'>Örnekler: x^2 · sin(x) · cos(x)*x · sqrt(x) · 2*x+3 · tan(x)</p>
</div>
</section>

<section id='tab-chem' class='tabsec mt-4 hidden fade'>
<div class='glass rounded-2xl p-4'>
<label class='text-xs text-slate-400'>Kimyasal formül</label>
<div class='flex gap-2 mt-1'>
<input id='cIn' type='text' value='H2SO4' placeholder='örn: H2SO4, C6H12O6, Ca(OH)2' class='flex-1 bg-[#0f172a] border border-slate-700 rounded-xl px-3 py-3 text-lg text-cyan-300 focus:border-cyan-500 transition'>
<button id='cGo' class='min-h-[50px] px-5 rounded-xl keq font-bold active:scale-95 transition'>Hesapla</button>
</div>
<div class='flex gap-2 mt-3 flex-wrap'>
<button class='ex px-3 py-1.5 rounded-lg text-xs kfn active:scale-95' data-f='H2SO4'>H₂SO₄</button>
<button class='ex px-3 py-1.5 rounded-lg text-xs kfn active:scale-95' data-f='C6H12O6'>C₆H₁₂O₆</button>
<button class='ex px-3 py-1.5 rounded-lg text-xs kfn active:scale-95' data-f='Ca(OH)2'>Ca(OH)₂</button>
<button class='ex px-3 py-1.5 rounded-lg text-xs kfn active:scale-95' data-f='NaCl'>NaCl</button>
</div>
<div id='cOut' class='mt-4'></div>
</div>
</section>

<section id='tab-circle' class='tabsec mt-4 hidden fade'>
<div class='glass rounded-2xl p-4'>
<div class='flex items-center gap-3'>
<input id='deg' type='range' min='0' max='360' value='45' step='1' class='flex-1'>
<div class='flex items-center gap-1'><input id='degIn' type='number' value='45' min='0' max='360' class='w-20 bg-[#0f172a] border border-slate-700 rounded-lg px-2 py-2 text-sm text-center'><span class='text-sm text-slate-400'>°</span></div>
</div>
<div class='mt-3 rounded-xl overflow-hidden bg-[#0f172a] border border-slate-800'><canvas id='ucCanvas' height='340' style='width:100%'></canvas></div>
<div class='grid grid-cols-3 gap-2 mt-3'>
<div class='bg-[#0f172a] border border-slate-800 rounded-xl p-3 text-center'><div class='text-xs text-cyan-400'>sin θ</div><div id='vSin' class='text-xl font-bold'>0.7071</div></div>
<div class='bg-[#0f172a] border border-slate-800 rounded-xl p-3 text-center'><div class='text-xs text-violet-400'>cos θ</div><div id='vCos' class='text-xl font-bold'>0.7071</div></div>
<div class='bg-[#0f172a] border border-slate-800 rounded-xl p-3 text-center'><div class='text-xs text-amber-400'>tan θ</div><div id='vTan' class='text-xl font-bold'>1.0000</div></div>
</div>
<div class='text-center text-sm text-slate-400 mt-2'>θ = <b id='vDeg' class='text-cyan-300'>45°</b> · <b id='vRad' class='text-violet-300'>0.785 rad</b></div>
</div>
</section>

<footer class='text-center text-xs text-slate-500 mt-10'>OmniCalc Pro · Tek dosya SPA · Tailwind + Chart.js + Math.js</footer>
</div>

<script>
'use strict';
// ---------- Tabs ----------
const tabs=document.querySelectorAll('.tab-btn');
function showTab(name){
  document.querySelectorAll('.tabsec').forEach(s=>s.classList.add('hidden'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  tabs.forEach(t=>t.classList.toggle('on',t.dataset.tab===name));
  if(name==='circle')drawUC();
  if(name==='graph')drawGraph();
}
tabs.forEach(t=>t.addEventListener('click',()=>showTab(t.dataset.tab)));
showTab('basic');

function fmt(n){
  if(typeof n!=='number'||!isFinite(n))return String(n);
  const r=math.round(n,10);
  if(Math.abs(r)>=1e12||(r!==0&&Math.abs(r)<1e-9))return r.toExponential(6);
  return String(r);
}

// ---------- Basic Calculator ----------
let bExpr='',bHist=[];
const bExprEl=document.getElementById('bExpr'),bDispEl=document.getElementById('bDisp'),bHistEl=document.getElementById('bHist');
function bRender(){bExprEl.textContent=bExpr;try{const v=math.evaluate(bExpr||'0');bDispEl.textContent=fmt(v);}catch(e){bDispEl.textContent=bExpr?'…':'0';}}
function bAddHist(e,r){bHist.unshift(e+' = '+r);if(bHist.length>20)bHist.pop();bHistEl.innerHTML=bHist.map(h=>'<div class="truncate">'+h+'</div>').join('');}
function bEval(){
  if(!bExpr)return;
  try{const v=math.evaluate(bExpr);const r=fmt(v);bAddHist(bExpr,r);bDispEl.textContent=r;bExpr='';bExprEl.textContent='';}
  catch(e){bDispEl.textContent='Hata';}
}
document.querySelectorAll('[data-k]').forEach(btn=>btn.addEventListener('click',()=>{
  const k=btn.dataset.k;
  if(k==='AC'){bExpr='';bRender();}
  else if(k==='B'){bExpr=bExpr.slice(0,-1);bRender();}
  else if(k==='pm'){const m=bExpr.match(/(-?\d*\.?\d+)$/);if(m){const n=(-parseFloat(m[1]));bExpr=bExpr.slice(0,m.index)+String(n);}bRender();}
  else if(k==='eq'){bEval();}
  else if(k.startsWith('ins:')){bExpr+=k.slice(4);bRender();}
}));
document.getElementById('bHC').addEventListener('click',()=>{bHist=[];bHistEl.innerHTML='';});

// ---------- Scientific ----------
let mem=0;
const sIn=document.getElementById('sIn'),sLive=document.getElementById('sLive'),memEl=document.getElementById('memV');
function sUpdate(){try{if(!sIn.value.trim()){sLive.textContent='0';return;}sLive.textContent=fmt(math.evaluate(sIn.value));}catch(e){sLive.textContent='…';}}
function sIns(t){const st=sIn.selectionStart||sIn.value.length;sIn.value=sIn.value.slice(0,st)+t+sIn.value.slice(sIn.selectionEnd||st);sIn.focus();sIn.setSelectionRange(st+t.length,st+t.length);sUpdate();}
function sEq(){try{const v=fmt(math.evaluate(sIn.value));sIn.value=v;sLive.textContent=v;}catch(e){sLive.textContent='Hata';}}
document.querySelectorAll('[data-s]').forEach(btn=>btn.addEventListener('click',()=>{
  const k=btn.dataset.s;
  if(k==='C'){sIn.value='';sLive.textContent='0';}
  else if(k==='B'){sIn.value=sIn.value.slice(0,-1);sUpdate();}
  else if(k==='eq'){sEq();}
  else if(k==='MC'){mem=0;memEl.textContent='0';}
  else if(k==='MR'){sIns(String(mem));}
  else if(k==='M+'||k==='M-'){try{const v=math.evaluate(sIn.value||'0');mem=k==='M+'?mem+v:mem-v;memEl.textContent=fmt(mem);}catch(e){}}
  else if(k.startsWith('ins:')){sIns(k.slice(4));}
}));
sIn.addEventListener('input',sUpdate);
sIn.addEventListener('keydown',e=>{if(e.key==='Enter')sEq();});

// ---------- Graph ----------
const gFn=document.getElementById('gFn'),gMin=document.getElementById('gMin'),gMax=document.getElementById('gMax'),gErr=document.getElementById('gErr');
let gChart=null;
function drawGraph(){
  gErr.classList.add('hidden');
  let f;try{f=math.compile(gFn.value||'x');f.evaluate({x:1});}catch(e){gErr.textContent='Geçersiz fonksiyon: '+e.message;gErr.classList.remove('hidden');return;}
  const mn=parseFloat(gMin.value)||-10,mx=parseFloat(gMax.value)||10;if(mx<=mn){gErr.textContent='x max > x min olmalı';gErr.classList.remove('hidden');return;}
  const xs=[],ys=[],N=400;
  for(let i=0;i<=N;i++){const x=mn+(mx-mn)*i/N;let y;try{y=f.evaluate({x:x});}catch(e){y=null;}if(y!==null&&!isFinite(y))y=null;xs.push(x);ys.push(y);}
  const data={labels:xs,datasets:[{label:'f(x) = '+gFn.value,data:ys,borderColor:'#22d3ee',borderWidth:2.5,pointRadius:0,tension:.25,spanGaps:true}]};
  if(gChart)gChart.destroy();
  gChart=new Chart(document.getElementById('gCanvas'),{type:'line',data:data,options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#94a3b8'}}},
    scales:{x:{type:'linear',ticks:{color:'#64748b',maxTicksLimit:10},grid:{color:'rgba(148,163,184,.08)'}},y:{ticks:{color:'#64748b',maxTicksLimit:8},grid:{color:'rgba(148,163,184,.08)'}}}
  }});
}
gFn.addEventListener('input',drawGraph);gMin.addEventListener('input',drawGraph);gMax.addEventListener('input',drawGraph);
document.getElementById('gReset').addEventListener('click',()=>{gFn.value='sin(x)';gMin.value='-10';gMax.value='10';drawGraph();});

// ---------- Chemistry ----------
const AW={H:1.008,He:4.0026,Li:6.94,Be:9.0122,B:10.81,C:12.011,N:14.007,O:15.999,F:18.998,Ne:20.18,Na:22.99,Mg:24.305,Al:26.982,Si:28.085,P:30.974,S:32.06,Cl:35.45,Ar:39.948,K:39.098,Ca:40.078,Ti:47.867,Cr:51.996,Mn:54.938,Fe:55.845,Co:58.933,Ni:58.693,Cu:63.546,Zn:65.38,Br:79.904,Ag:107.87,I:126.9,Ba:137.33,Pt:195.08,Au:196.97,Hg:200.59,Pb:207.2,Sn:118.71};
function parseFormula(s){
  const tokens=s.match(/([A-Z][a-z]?)|(\d+\.?\d*)|([()])/g);
  if(!tokens)throw new Error('Geçersiz formül');
  let i=0;
  function parseGroup(){
    const counts={};
    while(i<tokens.length){
      const t=tokens[i];
      if(t==='('){i++;const inner=parseGroup();if(tokens[i]===')')i++;else throw new Error('Parantez hatası');
        let mult=1;if(i<tokens.length&&/^\d/.test(tokens[i])){mult=parseFloat(tokens[i]);i++;}
        for(const el in inner)counts[el]=(counts[el]||0)+inner[el]*mult;}
      else if(t===')'){break;}
      else if(/^[A-Z]/.test(t)){i++;let n=1;if(i<tokens.length&&/^\d/.test(tokens[i])){n=parseFloat(tokens[i]);i++;}counts[t]=(counts[t]||0)+n;}
      else throw new Error('Beklenmeyen karakter: '+t);
    }
    return counts;
  }
  const c=parseGroup();
  if(i<tokens.length)throw new Error('Fazlalık: '+tokens[i]);
  return c;
}
function calcChem(){
  const f=document.getElementById('cIn').value.trim(),out=document.getElementById('cOut');
  try{
    const counts=parseFormula(f);
    let total=0;const rows=[];
    for(const el in counts){if(!(el in AW))throw new Error('Bilinmeyen element: '+el);const m=AW[el]*counts[el];total+=m;rows.push([el,counts[el],AW[el],m]);}
    let html='<div class="bg-[#0f172a] border border-cyan-500/30 rounded-xl p-4 text-center"><div class="text-xs text-slate-400">Molar Kütle</div><div class="text-3xl font-extrabold text-cyan-300">'+total.toFixed(3)+' <span class="text-base text-slate-400">g/mol</span></div></div>';
    html+='<div class="mt-3 space-y-2">';
    rows.sort((a,b)=>b[3]-a[3]).forEach(r=>{
      const pct=(r[3]/total*100);
      html+='<div class="bg-[#0f172a] border border-slate-800 rounded-xl p-3"><div class="flex justify-between text-sm"><span><b class="text-cyan-300">'+r[0]+'</b> × '+r[1]+'</span><span class="text-slate-300">'+r[3].toFixed(3)+' g/mol · <b class="text-violet-300">'+pct.toFixed(2)+'%</b></span></div><div class="mt-2 h-2 rounded-full bg-slate-800 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-cyan-500 to-violet-500" style="width:'+pct+'%"></div></div></div>';
    });
    html+='</div>';out.innerHTML=html;
  }catch(e){out.innerHTML='<div class="bg-rose-500/10 border border-rose-500/30 text-rose-300 rounded-xl p-4 text-sm">Hata: '+e.message+'</div>';}
}
document.getElementById('cGo').addEventListener('click',calcChem);
document.getElementById('cIn').addEventListener('keydown',e=>{if(e.key==='Enter')calcChem();});
document.querySelectorAll('.ex').forEach(b=>b.addEventListener('click',()=>{document.getElementById('cIn').value=b.dataset.f;calcChem();}));
calcChem();

// ---------- Unit Circle ----------
const uc=document.getElementById('ucCanvas'),degS=document.getElementById('deg'),degIn=document.getElementById('degIn');
function drawUC(){
  const d=parseFloat(degS.value)||0,rad=d*Math.PI/180;
  const sinv=Math.sin(rad),cosv=Math.cos(rad);
  document.getElementById('vSin').textContent=sinv.toFixed(4);
  document.getElementById('vCos').textContent=cosv.toFixed(4);
  document.getElementById('vTan').textContent=Math.abs(cosv)<1e-9?'∞ (tan)':Math.tan(rad).toFixed(4);
  document.getElementById('vDeg').textContent=d+'°';
  document.getElementById('vRad').textContent=rad.toFixed(3)+' rad';
  const w=uc.clientWidth||340,h=340;uc.width=w;uc.height=h;
  const ctx=uc.getContext('2d'),cx=w/2,cy=h/2,R=Math.min(w,h)/2-30;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(148,163,184,.12)';ctx.lineWidth=1;
  for(let g=-1;g<=1;g+=0.5){ctx.beginPath();ctx.moveTo(cx+g*R,cy-4);ctx.lineTo(cx+g*R,cy+4);ctx.moveTo(cx-4,cy+g*R);ctx.lineTo(cx+4,cy+g*R);ctx.stroke();}
  ctx.strokeStyle='#334155';ctx.beginPath();ctx.moveTo(cx-R-10,cy);ctx.lineTo(cx+R+10,cy);ctx.moveTo(cx,cy-R-10);ctx.lineTo(cx,cy+R+10);ctx.stroke();
  ctx.strokeStyle='#1e293b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,2*Math.PI);ctx.stroke();
  const px=cx+cosv*R,py=cy-sinv*R;
  ctx.lineWidth=2.5;ctx.strokeStyle='#8b5cf6';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,cy);ctx.stroke();
  ctx.strokeStyle='#06b6d4';ctx.beginPath();ctx.moveTo(px,cy);ctx.lineTo(px,py);ctx.stroke();
  ctx.strokeStyle='#f59e0b';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();
  ctx.strokeStyle='rgba(34,211,238,.5)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='rgba(139,92,246,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,26,0,-rad,rad!==0);ctx.stroke();
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(px,py,5,0,2*Math.PI);ctx.fill();
  ctx.fillStyle='#94a3b8';ctx.font='12px sans-serif';ctx.fillText('θ='+d+'°',cx+32,cy-8);
  ctx.fillStyle='#06b6d4';ctx.fillText('sin',px+6,py+(sinv>=0?14:-6));
  ctx.fillStyle='#8b5cf6';ctx.fillText('cos',cx+(cosv>=0?(px-cx)/2-12:(px-cx)/2-12),cy+16);
}
function syncDeg(v){v=Math.min(360,Math.max(0,v||0));degS.value=v;degIn.value=v;drawUC();}
degS.addEventListener('input',()=>{degIn.value=degS.value;drawUC();});
degIn.addEventListener('input',()=>syncDeg(parseFloat(degIn.value)));
window.addEventListener('resize',()=>{if(!document.getElementById('tab-circle').classList.contains('hidden'))drawUC();});
</script>
